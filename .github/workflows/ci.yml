# Continuous integration for ML: code quality -> pipeline + quality gate -> container.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit, data, model and API tests
        run: pytest

  pipeline:
    name: Train & evaluate (quality gate)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to diff metrics against the base branch
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[train,monitor]"

      - name: Reproduce pipeline (fails if roc_auc < evaluate.min_roc_auc)
        run: dvc repro

      - name: Metrics summary
        run: |
          echo "## Model metrics" >> "$GITHUB_STEP_SUMMARY"
          dvc metrics show --md >> "$GITHUB_STEP_SUMMARY"

      - name: Compare with base branch
        if: github.event_name == 'pull_request'
        run: |
          echo "## Changes vs ${{ github.base_ref }}" >> "$GITHUB_STEP_SUMMARY"
          dvc params diff "origin/${{ github.base_ref }}" --md >> "$GITHUB_STEP_SUMMARY"
          dvc metrics diff "origin/${{ github.base_ref }}" --md >> "$GITHUB_STEP_SUMMARY"

      - name: Drift check on fresh in-distribution data (should pass)
        run: |
          python -m churn.data.generate --n-rows 1000 --seed 123 --out data/simulated/fresh.csv
          python -m churn.monitoring.drift --current data/simulated/fresh.csv

      - uses: actions/upload-artifact@v4
        with:
          name: model
          path: models/model.joblib
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/

  docker:
    name: Build & smoke-test image
    needs: pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: model
          path: models/
      - name: Build
        run: docker build --build-arg MODEL_VERSION=${GITHUB_SHA::7} -t churn-api:ci .
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 churn-api:ci
          for i in $(seq 1 20); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"tenure_months":2,"monthly_charges":95,"support_calls":4,"senior_citizen":0,
                 "contract":"month_to_month","internet_service":"fiber","payment_method":"electronic_check"}'
      - name: Container logs
        if: always()
        run: docker logs api || true
