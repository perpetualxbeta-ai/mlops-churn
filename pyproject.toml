[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "churn"
version = "0.1.0"
description = "End-to-end MLOps starter: customer churn prediction with DVC, MLflow, FastAPI, Docker, GitHub Actions and Evidently."
readme = "README.md"
requires-python = ">=3.11"
# Core: what both training and serving need.
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.6,<2",
    "joblib>=1.4",
    "pyyaml>=6.0",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
train = [
    "mlflow>=3.16,<4",
    "pandera>=0.24",
    "dvc>=3.50,<4",
]
serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
monitor = [
    "evidently>=0.7,<0.8",
]
dev = [
    "churn[train,serve,monitor]",
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore:.*deprecated.*"]
